<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Deep Repo Scanner</title>
<script type="module" src="./rules.js"></script>
<script type="module">
import { rules, scanCode } from './rules.js';

async function fetchRepoFiles(owner, repo, path = '') {
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
  const response = await fetch(apiUrl);
  const data = await response.json();
  let files = [];

  for (const item of data) {
    if (item.type === 'file' && (item.name.endsWith('.js') || item.name.endsWith('.html') || item.name.endsWith('.jsx') || item.name.endsWith('.vue'))) {
      const raw = await fetch(item.download_url).then(r => r.text());
      files.push({ path: item.path, content: raw });
    } else if (item.type === 'dir') {
      const subFiles = await fetchRepoFiles(owner, repo, item.path);
      files = files.concat(subFiles);
    }
  }

  return files;
}

function renderResults(findings) {
  const container = document.getElementById('results');
  container.innerHTML = '';

  if (!findings.length) {
    container.innerHTML = '<p class="text-green-500 font-bold">No issues found!</p>';
    return;
  }

  findings.forEach(f => {
    const severityColor = f.severity === 'HIGH' ? 'text-red-600' :
                          f.severity === 'MEDIUM' ? 'text-yellow-600' : 'text-blue-600';

    const card = document.createElement('div');
    card.className = 'p-4 mb-3 border rounded shadow hover:shadow-lg transition';

    card.innerHTML = `
      <h3 class="font-bold ${severityColor}">${f.name} [${f.severity}]</h3>
      <p class="text-gray-700 font-mono break-all">File: ${f.file}</p>
      <p class="text-gray-600">${f.description}</p>
    `;
    container.appendChild(card);
  });
}

document.getElementById('scanBtn').addEventListener('click', async () => {
  const urlInput = document.getElementById('repoUrl').value.trim();
  if (!urlInput) return alert('Enter GitHub repo URL');

  // Parse owner/repo
  const match = urlInput.match(/github\.com\/([^\/]+)\/([^\/]+)/);
  if (!match) return alert('Invalid GitHub repo URL');

  const owner = match[1];
  const repo = match[2];

  document.getElementById('results').innerHTML = '<p class="text-gray-500">Fetching repo files...</p>';
  try {
    const files = await fetchRepoFiles(owner, repo);
    const allFindings = [];
    for (const f of files) {
      const findings = scanCode(f.content, f.path);
      allFindings.push(...findings);
    }
    renderResults(allFindings);
  } catch (err) {
    document.getElementById('results').innerHTML = `<p class="text-red-500">Error: ${err.message}</p>`;
  }
});
</script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4">
  <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">Deep GitHub Repo Scanner</h1>
  
  <div class="w-full max-w-xl mb-6">
    <input id="repoUrl" type="text" placeholder="Enter GitHub repo URL" class="w-full p-3 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400" />
    <button id="scanBtn" class="mt-3 w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">Start Deep Scan</button>
  </div>

  <div id="results" class="w-full max-w-3xl space-y-2"></div>
</body>
</html>
