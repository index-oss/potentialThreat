<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Vulnerability Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center p-4">
  <h1 class="text-2xl font-bold mb-4">GitHub JS Vulnerability Scanner</h1>

  <!-- Input section -->
  <div class="w-full max-w-xl mb-4">
    <input id="repoUrl" type="text" placeholder="Enter GitHub repo URL"
      class="w-full p-2 rounded bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500" />
    <button id="fetchBtn" class="mt-2 w-full bg-blue-600 hover:bg-blue-700 p-2 rounded font-semibold">
      Fetch & Scan JS Files
    </button>
  </div>

  <!-- Output section -->
  <div id="output" class="w-full max-w-xl space-y-2"></div>

  <!-- JS -->
  <script type="module">
    import { scanCode } from './rules.js';

    const fetchBtn = document.getElementById("fetchBtn");
    const output = document.getElementById("output");
    const repoInput = document.getElementById("repoUrl");

    async function fetchJSFiles(owner, repo) {
      const apiUrl = `https://api.github.com/repos/${owner}/${repo}/git/trees/main?recursive=1`;
      const res = await fetch(apiUrl);
      const data = await res.json();
      return data.tree.filter(f => f.path.endsWith(".js") && f.type === "blob");
    }

    async function fetchFileContent(owner, repo, path) {
      const url = `https://raw.githubusercontent.com/${owner}/${repo}/main/${path}`;
      const res = await fetch(url);
      return await res.text();
    }

    async function fetchRepoFiles(repoUrl) {
      output.innerHTML = "";
      try {
        output.innerHTML = "<p class='text-yellow-400'>Fetching JS files...</p>";

        const match = repoUrl.match(/github\.com\/([^\/]+)\/([^\/]+)/);
        if (!match) throw new Error("Invalid GitHub URL");

        const owner = match[1];
        const repo = match[2];

        const jsFiles = await fetchJSFiles(owner, repo);

        if (!jsFiles.length) {
          output.innerHTML = "<p class='text-yellow-400'>No JS files found in this repo.</p>";
          return;
        }

        for (const file of jsFiles) {
          const div = document.createElement("div");
          div.className = "bg-gray-800 p-2 rounded";

          const title = document.createElement("button");
          title.textContent = file.path;
          title.className = "w-full text-left font-bold mb-1 hover:bg-gray-700 p-1 rounded";
          div.appendChild(title);

          const contentDiv = document.createElement("pre");
          contentDiv.className = "max-h-64 overflow-auto hidden bg-gray-700 p-2 rounded text-xs";
          div.appendChild(contentDiv);

          const findingsDiv = document.createElement("div");
          findingsDiv.className = "mt-2 space-y-1 hidden";
          div.appendChild(findingsDiv);

          title.addEventListener("click", async () => {
            if (!contentDiv.textContent) {
              contentDiv.textContent = "Fetching content...";
              const content = await fetchFileContent(owner, repo, file.path);
              contentDiv.textContent = content;
              contentDiv.classList.remove("hidden");

              // Scan using rules.js
              const findings = scanCode(content, file.path);
              findingsDiv.innerHTML = "";
              if (!findings.length) {
                const noFind = document.createElement("div");
                noFind.className = "p-2 bg-green-700 rounded";
                noFind.textContent = "No issues detected";
                findingsDiv.appendChild(noFind);
              } else {
                findings.forEach(f => {
                  const fDiv = document.createElement("div");
                  fDiv.className = `p-2 rounded ${f.severity === "HIGH" ? "bg-red-600" : "bg-yellow-600"}`;
                  fDiv.textContent = `${f.name} - ${f.severity}: ${f.description}`;
                  findingsDiv.appendChild(fDiv);
                });
              }
              findingsDiv.classList.remove("hidden");
            } else {
              contentDiv.classList.toggle("hidden");
              findingsDiv.classList.toggle("hidden");
            }
          });

          output.appendChild(div);
        }

      } catch (err) {
        output.innerHTML = `<p class='text-red-500'>Error: ${err.message}</p>`;
      }
    }

    fetchBtn.addEventListener("click", () => {
      const url = repoInput.value.trim();
      if (url) fetchRepoFiles(url);
    });

  </script>
</body>
</html>
