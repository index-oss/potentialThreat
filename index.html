<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub JS Fetcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4">

  <div class="max-w-xl mx-auto">
    <h1 class="text-2xl font-bold mb-4 text-center">GitHub JS Fetcher</h1>

    <!-- Input -->
    <input id="repoUrl" type="text" placeholder="Enter GitHub repo URL"
      class="w-full p-2 rounded bg-gray-800 text-white mb-4" />

    <!-- Button -->
    <button id="fetchBtn" class="w-full p-2 bg-blue-600 rounded hover:bg-blue-700">Fetch JS Files</button>

    <!-- Output -->
    <div id="output" class="mt-4 space-y-2"></div>
  </div>

  <script>
    const fetchBtn = document.getElementById("fetchBtn");
    const output = document.getElementById("output");
    const repoInput = document.getElementById("repoUrl");

    async function fetchJSFiles(repoUrl) {
      try {
        output.innerHTML = "Fetching JS files...";
        
        // Extract owner and repo name from URL
        const match = repoUrl.match(/github\.com\/([^\/]+)\/([^\/]+)/);
        if (!match) {
          output.innerHTML = "<span class='text-red-500'>Invalid GitHub URL</span>";
          return;
        }

        const owner = match[1];
        const repo = match[2];

        // GitHub API: Get repo tree recursively
        const apiUrl = `https://api.github.com/repos/${owner}/${repo}/git/trees/main?recursive=1`;
        const res = await fetch(apiUrl);
        const data = await res.json();

        if (!data.tree) {
          output.innerHTML = "<span class='text-red-500'>Could not fetch repo files. Check branch name.</span>";
          return;
        }

        // Filter .js files
        const jsFiles = data.tree.filter(f => f.path.endsWith(".js") && f.type === "blob");
        if (jsFiles.length === 0) {
          output.innerHTML = "<span class='text-yellow-400'>No JS files found in repo.</span>";
          return;
        }

        // Show results
        output.innerHTML = "";
        jsFiles.forEach(file => {
          const div = document.createElement("div");
          div.textContent = file.path;
          div.className = "p-2 bg-gray-800 rounded";
          output.appendChild(div);
        });

      } catch (err) {
        output.innerHTML = `<span class='text-red-500'>Error: ${err.message}</span>`;
      }
    }

    fetchBtn.addEventListener("click", () => {
      const repoUrl = repoInput.value.trim();
      if (repoUrl) fetchJSFiles(repoUrl);
    });
  </script>

</body>
</html>
